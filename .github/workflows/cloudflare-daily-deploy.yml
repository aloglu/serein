name: Publish and verify daily poem

on:
  schedule:
    # 00:00 Istanbul time (UTC+3) -> 21:00 UTC previous day
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Trigger deploy and verify public poem
        env:
          CF_PAGES_DEPLOY_HOOK: ${{ secrets.CF_PAGES_DEPLOY_HOOK }}
        run: node scripts/daily-deploy.mjs
